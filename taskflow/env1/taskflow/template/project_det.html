<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlows – Project Tab</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">

  <div id="swapTab" class="w-full mx-auto">
    <!-- <h1 class="text-3xl font-bold mb-6">Projects Dashboard</h1> -->

    <!-- Project Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- Project Card -->
      {% for project in pro_det %}
        <div class="bg-white rounded-lg shadow p-5">
          <div class="flex justify-between items-center mb-2">
            <h2 class="text-xl font-semibold">{{project.project_name}}</h2>
            <span class="text-green-700 bg-green-100 text-xs px-3 py-1 rounded-full">{{project.status}}</span>
          </div>
          <p class="text-sm text-gray-600 mb-2"><strong>Client:</strong>{{project.client_details.company_name}}</p>
          <p class="text-sm text-gray-600 mb-2"><strong>Last Updated:</strong>{{project.end_date}}</p>
          <p class="text-sm text-gray-600 mb-2"><strong>Tasks:</strong> {{project.t_count}} total, {{ project.pending_count}} completed</p>
          <div class="w-full bg-gray-200 rounded-full h-2 mb-4">
            <div class="bg-blue-500 h-2 rounded-full" style="width: 58%"></div>
          </div>
          <div class="flex gap-2">
            <button id="projectId" onclick="proDetailView('{{ project.projectid }}')" class="bg-blue-600 text-white px-4 py-1 rounded hover:bg-blue-700 text-sm">View</button>
            <!-- <button class="bg-red-100 text-red-600 px-4 py-1 rounded hover:bg-red-200 text-sm">Edit</button> -->
          </div>
        </div>
      {% endfor %}

    </div>
  </div>

</body>
</html>
