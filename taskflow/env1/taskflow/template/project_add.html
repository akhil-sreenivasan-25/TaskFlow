<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Taskflow - Add Project</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <style>
    body { font-family: Arial, sans-serif; }
    .modal {
      display: none; 
      position: fixed; 
      z-index: 1; 
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 20px;
      border-radius: 8px;
      width: 600px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .close {
      float: right;
      font-size: 20px;
      cursor: pointer;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
    }
    .button1 {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }

    /* dropdown menu */
    .container{
      position: relative;
      max-width: 320px;
      width: 100%;
      margin: 50px auto 30px;
    }
    .container.open .arrow-dwn {
      transform: rotate(-180deg);
      transition: transform 0.3s ease;
    }
    .select-btn-open{
      display: flex;
      height: 50px;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      background: #fff;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }
    .select-btn .btn-text{
      font-size: 17px;
      font-weight: 400;
      color: #333;
    }
    .select-btn-open .arrow-dwn{
      display: flex;
      height: 21px;
      width: 21px;
      color: #fff;
      font-size: 14px;
      border-radius: 50%;
      background: #3d65d4;
      align-items: center;
      justify-content: center;      
      transition: 0.3s ;
    }
    .arrow-dwn {
     transform: rotate(0deg);
     transition: transform 0.3s ease;
    }
    .select-btn-open .arrow-dwn{
      transform: rotate(-180deg);
    }
    .container.open .arrow-dwn {
     transform: rotate(-180deg);
    }
    .select-btn-open ~ .list-items{
      opacity: 0;
      animation-name: fadeInUp;
      animation-duration: 0.4s;
      animation-fill-mode: both;
      -webkit-animation-duration: 0.4s;
      -webkit-animation-fill-mode: both;
    }
    .list-items {
      position: absolute;
      max-width: 320px;
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
      padding: 16px;
      background-color: #fff;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
      animation-name: fadeInDown;
      -webkit-animation-name: fadeInDown;
      animation-duration: 0.35s;
      animation-fill-mode: both;
      -webkit-animation-duration: 0.35s;
      -webkit-animation-fill-mode: both;

    } 
    .list-items .item{
      display: flex;
      align-items: center;
      list-style: none;
      height: 50px;
      cursor: pointer;
      transition: 0.3s;
      padding: 0 15px;
      border-radius: 8px;
    }
    .list-items .item:hover{
      background-color: #e3f2fd;
    }
    .item .item-text {
      font-size: 16px;
      font-weight: 400;
      color: #333;
    }
    .item .checkbox{
      display: flex;
      align-items: center;
      justify-content: center;
      height: 16px;
      width: 16px;
      margin-right: 12px;
      border-radius: 4px;
      border: 1.5px solid #c0c0c0;
      transition: 0.3s ease-in-out;
    }
    .item.checked .checkbox{
      background: #4070f4;
      border-color: #4070f4;
    }
    .item.checked .check-icon{
      color: #fff;
      font-size: 11px;
      transform: scale(0);
      transition: all 0.2s ease-in-out;
    }




    .container .list-items {
      display: none;
    }

    .container.open .list-items {
      display: block;
      background-color: #fff; /* Ensure background is visible */
    }



    @keyframes fadeInUp{
      from{
        transform: translate3d(0, 30px , 0);
      }
      to {
        transform: translate3d(0, 0 , 0);
        opacity: 1;
      }
    }
    @keyframes fadeInDown{
      from{
        transform: translate3d(0, 0 , 0);
      }
      to {
        transform: translate3d(0, 20px , 0);
        opacity: 0;
      }
    }

  </style>
</head>
<body>


<div id="projectModal" class="modal">
  <form method="POST" action="{% url 'add_project' %}">
    {% csrf_token %}
    <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3>Add New Project</h3>
    <input type="text" name="p_name" id="projectName" placeholder="Project Name" required>
    <input type="text" name="p_desc" id="projectDscription" placeholder="Disccription" required><br>
    <label>End Date   :</label>
    <input type="date" name="p_end" id="projectName" placeholder="End Date">
    <div class ='container'>
      <div class ='select-btn-open' onclick="toggleDropdown()">
        <span class ='btn-text'>Select Team Members</span>
        <span class ='arrow-dwn'>
          <i class='fa-solid fa-chevron-down'></i>
        </span>
      </div>
      <ul class='list-items'>
        {% for emp_det in emp_det %}
          <li class='item'>        
              <input type="checkbox" name="p_members" id="{{emp_det.empid}}" value="{{emp_det.empid}}">
              <label for="{{emp_det.empid}}">&nbsp;{{emp_det.empid}}&nbsp;&nbsp;&nbsp;({{emp_det.name}})</label>
          </li>
        {% endfor %}
      </ul>
      

    </div>
    <button class="button1" onclick="addProject()">Create Project</button>
    </div>
  </form>
</div>

<script>
  function toggleDropdown() {
    const container = document.querySelector('.container');
    container.classList.toggle('open');
  }
  function openModal() {
    document.getElementById("projectModal").style.display = "block";
  }

  function closeModal() {
    document.getElementById("projectModal").style.display = "none";
  }

  function addProject() {
    const name = document.getElementById("projectName").value;
    if (name.trim() === "") {
      alert("Please enter a project name.");
      return;
    }
    console.log("New project added:", name);
    // You can replace this with actual logic to save the project
    closeModal();
  }
</script>

</body>
</html>
