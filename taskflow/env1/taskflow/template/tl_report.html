<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Reports</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      background-color: #f4f6f8;
    }
    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #2c3e50;
      color: white;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 15px 0;
      padding: 10px;
      border-radius: 5px;
      transition: background 0.3s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: #34495e;
    }

    /* Main Content */
    .main {
      flex-grow: 1;
      padding: 20px;
    }
    .main h1 {
      margin-bottom: 20px;
      color: #333;
    }

    /* Report Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card h3 {
      margin: 0;
      color: #555;
    }
    .card p {
      font-size: 22px;
      margin-top: 10px;
      font-weight: bold;
      color: #2c3e50;
    }

    /* Charts Placeholder */
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .chart {
      background: white;
      height: 250px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #888;
      font-style: italic;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* Export Button */
    .export-btn {
      margin-top: 20px;
      padding: 12px 18px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .export-btn:hover {
      background: #219150;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>TaskFlow</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="tasks.html">Tasks</a>
    <a href="team.html">Team Members</a>
    <a href="reports.html" class="active">Reports</a>
  </div>

  <!-- Main Content -->
  <div class="main">
    <h1>📊 Reports</h1>

    <!-- Cards -->
    <div class="cards">
      <div class="card">
        <h3>Total Projects</h3>
        <p>12</p>
      </div>
      <div class="card">
        <h3>Active Tasks</h3>
        <p>45</p>
      </div>
      <div class="card">
        <h3>Completed Tasks</h3>
        <p>120</p>
      </div>
      <div class="card">
        <h3>Overdue</h3>
        <p>8</p>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts">
      <div class="chart">[Pie Chart - Task Status]</div>
      <div class="chart">[Bar Chart - Team Performance]</div>
    </div>

    <!-- Export -->
    <button class="export-btn">📥 Export Report</button>
  </div>
</body>
</html>
